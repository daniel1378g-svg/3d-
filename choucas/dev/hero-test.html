<!doctype html>
<html lang="de-CH">
  <head><meta charset="UTF-8" /><title>Hero scene test</title>
  <style>html,body{margin:0;height:100%;background:#1c1814}#h{position:relative;width:100vw;height:100vh}canvas{width:100%;height:100%;display:block}</style></head>
  <body>
    <!-- Renders the Pizza | Parrilla scene alone, also on software GL: ?split=0.5 (&still) -->
    <div id="h"><canvas id="c"></canvas></div>
    <script type="module">
      import { createHero } from "/src/components/hero/engine.ts";
      const q = new URLSearchParams(location.search);
      try {
        const e = createHero(document.getElementById("c"), document.getElementById("h"), { still: q.has("still"), force: true, onFirstFrame: () => (window.__heroReady = true) });
        e.setSplit(Number(q.get("split") ?? 0.5));
        window.__hero = e;
      } catch (err) { window.__heroError = String(err); console.error(err); }
    </script>
  </body>
</html>
