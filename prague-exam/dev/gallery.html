<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asset gallery · Prague Exam Drive</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #17191c; color: #d8dadd; font: 13px/1.4 system-ui, sans-serif; }
  header { padding: 12px 16px 4px; }
  header h1 { margin: 0 0 4px; font-size: 17px; }
  header a { color: #8fb8ff; margin-right: 12px; }
  section { padding: 8px 16px 20px; }
  section h2 { margin: 12px 0 6px; font-size: 14px; font-weight: 600; color: #fff; }
  section p { margin: 0 0 8px; color: #9aa0a6; max-width: 110ch; }
  canvas { display: block; max-width: 100%; border-radius: 4px; }
  .view { position: relative; display: inline-block; max-width: 100%; }
  .tag { position: absolute; padding: 1px 5px; background: rgba(0, 0, 0, .62); color: #fff; font-size: 11px; border-radius: 3px; white-space: nowrap; pointer-events: none; }
  .checker { background: repeating-conic-gradient(#3a3d42 0% 25%, #2b2e32 0% 50%) 0 0 / 16px 16px; }
  table { border-collapse: collapse; margin-top: 8px; }
  td, th { padding: 2px 10px 2px 0; text-align: left; font-variant-numeric: tabular-nums; }
  #log { color: #ff8a80; white-space: pre-wrap; padding: 0 16px; }
</style>
</head>
<body>
<header>
  <h1>Asset gallery</h1>
  <nav>
    <a href="?">all</a><a href="?only=signs">signs</a><a href="?only=surfaces">surfaces</a>
    <a href="?only=facades">facades</a><a href="?only=models">models</a>
  </nav>
  <div>Options: <code>&amp;still=1</code> stops the turntable, <code>&amp;angle=40</code> sets it (degrees), <code>&amp;faces=1</code> paints back faces magenta.</div>
</header>
<div id="log"></div>
<main id="main"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.159.0/three.min.js"></script>
<script type="module" src="gallery.js"></script>
</body>
</html>
