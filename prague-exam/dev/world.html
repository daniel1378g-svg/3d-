<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>World renderer test · Prague Exam Drive</title>
<style>
  html, body { margin: 0; height: 100%; background: #101214; overflow: hidden; font: 12px/1.35 ui-monospace, Menlo, monospace; }
  #view { display: block; width: 100%; height: 100%; touch-action: none; }
  #hud { position: fixed; left: 8px; bottom: 8px; padding: 4px 7px; background: rgba(0, 0, 0, .55); color: #e8eaec; border-radius: 4px; white-space: pre; pointer-events: none; }
  #err { position: fixed; left: 8px; top: 8px; color: #ff8a80; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud">loading…</div>
<div id="err"></div>
<!-- Query: x, z, h (heading, rad), y (eye height), pitch, q=low|medium|high, t (start time, s), freeze=1,
     traffic=0, mirrors=1, hud=0, place=<id from net.places>. Keys: arrows/WASD drive, Q/E up/down, M mirrors, 1/2/3 quality. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.159.0/three.min.js"></script>
<script type="module" src="world.js"></script>
</body>
</html>
